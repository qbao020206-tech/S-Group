<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <title>Animation</title>
    <style>
        body{
           margin:0;
           padding:0;
           background-color: orange;
           height: 100vh; 
           display: flex;
           justify-content: center;
           align-items: flex-start;
           padding-top:100px;
        }
        .image{
            width: 900px;
            height: 550px;
            background-image: url('hinhconcao.jpg');
            background-size: cover;
            background-position: center;
            position: relative
        }
        .img-text{
            position: absolute;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            color: white;
            font-family: 'Courier New', Courier, monospace; 
            font-size: 60px;
            letter-spacing: 4px;
            width: 100%;
            text-align: center;
            opacity: 1;
            transition: all 0.5s ease;
        }
        .first{
            font-weight: 300;
        }
        .last{
            font-weight: 1000;
        }

        .image:hover .img-text{
            position: absolute;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%);
            font-size: 40px;
            opacity: 0;
            transition: all 0.5s ease;
        }
        .box{
            position: absolute;
            width: 350px;
            height: 350px;
            background-color: transparent;
            border: 15px solid orange;
            top: 50%; 
            left: 50%; 
            transform: translate(-50%, -50%) rotate(45deg);
            opacity: 0;
            transition: all 0.5s ease;
        }
        .image:hover .box{
            opacity: 1;
            width: 300px;
            height: 300px;                                     
            transition: all 0.5s ease;
        }
        .incon1{
            position: absolute; 
            top: 30px;
            left: 100px;          
            font-size: 50px; 
            color: orange;    
            margin: 10px; 
            opacity:0;
            transition: all 0.5s ease;
        }
        .image:hover .incon1{
            opacity: 1;
            font-size: 70px;
            top: 85px;
            left: 180px; 
            transition: all 0.5s ease;   
        }
        .incon2{
            position: absolute;           
            font-size: 50px;
            bottom: 30px;
            left: 100px;  
            color: orange;    
            margin: 10px; 
            opacity:0;
            transition: all 0.5s ease;
        }
        .image:hover .incon2{
            opacity: 1;
            font-size: 70px;
            bottom: 85px;
            left: 180px; 
            transition: all 0.5s ease;   
        } 
        .incon3{
            position: absolute;           
            font-size: 50px;
            top: 30px;
            right: 100px;         
            color: orange;    
            margin: 10px; 
            opacity:0;
            transition: all 0.5s ease;
        }
        .image:hover .incon3{
            opacity: 1;
            font-size: 70px;
            top: 85px;
            right: 180px; 
            transition: all 0.5s ease;   
        }
        .incon4{
            position: absolute;           
            font-size: 50px; 
            bottom: 30px;
            right: 100px;         
            color: orange;    
            margin: 10px; 
            opacity:0;
            transition: all 0.5s ease;
        }
        .image:hover .incon4{
            opacity: 1;
            font-size: 70px;
            bottom: 85px;
            right: 180px; 
            transition: all 0.5s ease;   
        }
    </style>


</head>
<body>
    <div class="image">
        <div class="img-text">
            <span class="first">TENDER</span><span class="last">HERA</span>
        </div>
        <div class="box"></div>
        <div class="incon1"><i class="fa-regular fa-file-pdf incon1"></i></div>
        <div class="incon2"><i class="fa-regular fa-file-image incon2"></i></div>
        <div class="incon3"><i class="fa-regular fa-file-zipper incon3"></i></div>
        <div class="incon4"><i class="fa-regular fa-file-code incon4"></i></div>
    </div>

</body>
</html>
