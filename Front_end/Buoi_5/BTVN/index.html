<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALL IN</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>
    <section>
        <h2> TRANSFORM - HOVER VÀO TỪNG Ô </h2>
        <div class="transform">
            <div class="cl box-translate">translate</div>
            <div class="cl box-rotate">rotate</div>
            <div class="cl box-scale">scale</div>
            <div class="cl box-combine">combine</div>
        </div>
    </section>
    <section >
        <h2> OVERLAY EFECT - HOVER VAO CARD </h2>
        <div class="overlay">
            <div class="card">
                <img src="Rocon1.jpg" >
                <div class="overlay-card1">CRISTIANO</div>
            </div>
            <div class="card">
                <img src="Rocon3.jpg" >
                <div class="overlay-card2">CR7</div>
            </div>
            <div class="card">
                <img src="Rocon2.webp" >
                <div class="overlay-card1">RONADO</div>
            </div>
        </div>
    </section>
    <section>
        <h2> @KEYFRAMES ANIMATION </h2>
        <div class="animation">
            <div class="cl box-bounce">bounce</div>
            <div class="cl box-spin">spin</div>
            <div class="cl box-pulse">pulse</div>
            <div class="cl box-slidein">slidein</div>
        </div>
    </section>
    <section>
        <h2>CSS LOADERS (PURE CSS)</h2>
        <div class="loaders">
            <div class="loader1"></div>
            <div class="loader2">
                <span></span><span></span><span></span>
            </div>
            <div class="loader3">
                <span></span><span></span><span></span><span></span><span></span>
            </div>

        </div>
    </section>
</body>
</html>
